# Hardware video decode/encode via VA-API on the Intel iGPU (X11, GL).
# Needs intel-media-driver. Verify in chrome://gpu ("Video Acceleration
# Information" must list profiles) and chrome://media-internals.
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoEncoder
# Hybrid Intel+NVIDIA: VA-API skips the nvidia-drm node and then finds no
# render node at all, so point it at the iGPU (by-path is stable across boots).
--render-node-override=/dev/dri/by-path/pci-0000:00:02.0-render
