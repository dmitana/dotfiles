# Battery-first TLP profile for the Legion 7 16IRX9 (i7-14700HX + RTX 4060).
# Values come from a runtime experiment on 2026-11-07: 49.8 W -> 19.7 W at idle
# on battery. EPP "power" and turbo off were measured too and gave nothing.
#
# RUNTIME_PM_DRIVER_DENYLIST is left at the TLP default, which contains nvidia:
# the dGPU's runtime PM is handled by nvidia-utils' 80-nvidia-pm.rules (auto ->
# D3cold when idle). Do not add an nvidia/"on" override here.
#
# Install by copying, not symlinking: tlp.service runs with ProtectHome=yes and
# silently skips a link into /home at boot (TLP defaults apply instead):
#   sudo install -m644 ~/etc/tlp/50-battery.conf /etc/tlp.d/50-battery.conf
# Re-run that after every change, then `sudo tlp start`.

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1

PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=low-power

PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

USB_AUTOSUSPEND=1

NMI_WATCHDOG=0

SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
